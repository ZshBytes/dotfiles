# ============================================================
# WORKSPACE MANAGEMENT
# ============================================================

# Move active window to a workspace with:
# Super + Ctrl + [0-9]

bindd = SUPER CTRL, 1, Move to WS 1, movetoworkspace, 1
bindd = SUPER CTRL, 2, Move to WS 2, movetoworkspace, 2
bindd = SUPER CTRL, 3, Move to WS 3, movetoworkspace, 3
bindd = SUPER CTRL, 4, Move to WS 4, movetoworkspace, 4
bindd = SUPER CTRL, 5, Move to WS 5, movetoworkspace, 5
bindd = SUPER CTRL, 6, Move to WS 6, movetoworkspace, 6
bindd = SUPER CTRL, 7, Move to WS 7, movetoworkspace, 7
bindd = SUPER CTRL, 8, Move to WS 8, movetoworkspace, 8
bindd = SUPER CTRL, 9, Move to WS 9, movetoworkspace, 9
bindd = SUPER CTRL, 0, Move to WS 10, movetoworkspace, 10
