# ============================================================
# APPLICATION KEYBINDINGS
# ============================================================

#unbindings
unbind = SUPER ALT, SPACE
unbind = SUPER CTRL, E

#emoji
bind = SUPER, period, exec, omarchy-launch-walker -m symbols

# Clipboard
unbind = SUPER CTRL, V
unbind = SUPER SHIFT, SPACE
bindd = SUPER, V, Clipboard, exec, walker -m clipboard

# Terminal
unbind = SUPER, T
bindd = SUPER, T, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"

# Browser
unbind = SUPER, W
bindd = SUPER, W, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, W, Browser (private), exec, omarchy-launch-browser --private

# File Manager
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
# bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"

# Editor
# bindd = SUPER, C, Editor, exec, omarchy-launch-editor
bindd = SUPER, C, Editor, exec, kwrite

# Music
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp

# Development / Containers
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker

# Communication
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"

# Notes / Productivity
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, Q, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password


